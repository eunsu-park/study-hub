# === Exercise 4: Rate Limiting and Custom Headers ===
# Apply rate limiting and security headers via Ingress annotations.
# Hint: These annotations are specific to nginx-ingress controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rate-limited-ingress
  annotations:
    # TODO: Set rate limit to 10 requests per second per IP
    # Hint: nginx.ingress.kubernetes.io/limit-rps: "10"
    # TODO: Set burst limit to 20
    # Hint: nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    # TODO: Add CORS headers allowing origin "https://app.example.com"
    # Hint: nginx.ingress.kubernetes.io/enable-cors: "true"
    # Hint: nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.example.com"
spec:
  ingressClassName: nginx
  rules:
  - host: api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-svc
            port:
              number: 8080

