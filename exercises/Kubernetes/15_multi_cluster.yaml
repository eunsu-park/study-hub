# === Exercise 1: Kubefed Federated Deployment ===
# Deploy a workload across multiple clusters using KubeFed.
# Hint: KubeFed propagates resources from a host cluster to member clusters.
apiVersion: types.kubefed.io/v1beta1
kind: FederatedDeployment
metadata:
  name: global-web-app
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: global-web
    spec:
      replicas: 3
      selector:
        matchLabels:
          app: global-web
      template:
        metadata:
          labels:
            app: global-web
        spec:
          containers:
          - name: web
            image: nginx:1.25-alpine
            ports:
            - containerPort: 80
  placement:
    # TODO: List the target clusters for this deployment
    # Hint:
    #   clusters:
    #   - name: cluster-us-east
    #   - name: cluster-eu-west
    #   - name: cluster-ap-southeast
  overrides:
  # TODO: Override replicas per cluster (more in primary, fewer in secondary)
  # Hint:
  #   - clusterName: cluster-us-east
  #     clusterOverrides:
  #     - path: "/spec/replicas"
  #       value: 5
  #   - clusterName: cluster-eu-west
  #     clusterOverrides:
  #     - path: "/spec/replicas"
  #       value: 3

