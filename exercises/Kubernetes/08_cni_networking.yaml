# === Exercise 3: Multi-Port and Named Port Policy ===
# Create a policy allowing traffic on multiple specific ports.
# Hint: Named ports reference the containerPort name from the Pod spec.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: multi-port-policy
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: web-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: load-balancer
    ports:
    # TODO: Allow TCP port 80 (HTTP)
    # TODO: Allow TCP port 443 (HTTPS)
    # TODO: Allow TCP on named port "metrics" (port 9090 in Pod spec)
    # Hint: Use 'port: metrics' to reference a named port

