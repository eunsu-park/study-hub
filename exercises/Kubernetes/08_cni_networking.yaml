# === Exercise 2: IP Block Rules ===
# Allow/deny traffic based on CIDR blocks.
# Hint: ipBlock is useful for allowing access to external services by IP range.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cidr-policy
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        # TODO: Allow ingress from the corporate network 10.0.0.0/8
        # TODO: Exclude the management subnet 10.0.1.0/24 using 'except'
    ports:
    - port: 443
      protocol: TCP
  egress:
  - to:
    - ipBlock:
        # TODO: Allow egress to a specific external API at 203.0.113.0/24
    ports:
    - port: 443

