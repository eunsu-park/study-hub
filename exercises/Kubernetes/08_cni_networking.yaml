# === Exercise 4: Default Allow All Egress + Deny Specific ===
# Start with open egress, then deny traffic to metadata service.
# Hint: Cloud metadata services (169.254.169.254) are a security risk.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: block-metadata-service
  namespace: production
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # TODO: Allow all egress EXCEPT to the cloud metadata endpoint
  # Strategy: Allow 0.0.0.0/0 but exclude 169.254.169.254/32
  # Hint:
