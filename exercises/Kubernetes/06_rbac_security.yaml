kind: Pod
metadata:
  name: secure-app
spec:
  serviceAccountName: config-reader-sa
  securityContext:
    # TODO: Set runAsNonRoot to true
    # TODO: Set runAsUser to 1000
    # TODO: Set runAsGroup to 1000
    # TODO: Set fsGroup to 2000 (for volume permissions)
  containers:
  - name: app
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8080"]
    securityContext:
      # TODO: Set allowPrivilegeEscalation to false
      # TODO: Set readOnlyRootFilesystem to true
      # TODO: Drop ALL capabilities using:
      #   capabilities:
      #     drop: ["ALL"]
    resources:
      limits:
        cpu: "200m"
        memory: "128Mi"
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  volumes:
  - name: tmp
    emptyDir: {}

