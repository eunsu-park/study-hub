kind: Role
metadata:
  name: configmap-reader
  namespace: default
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  # TODO: Set verbs to ["get", "list", "watch"]
  # TODO: Optionally restrict to specific ConfigMaps using resourceNames

---
