# === Exercise 1: Role and RoleBinding ===
# Grant read-only access to Pods in the "dev" namespace.
# Hint: Role is namespace-scoped; ClusterRole is cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: dev
rules:
- apiGroups: [""]
  # TODO: Set resources to ["pods", "pods/log"]
  # TODO: Set verbs to ["get", "list", "watch"]
  # Hint: "" apiGroup = core API (Pods, Services, ConfigMaps)

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-pod-reader
  namespace: dev
subjects:
- kind: User
  # TODO: Set the user name to "developer@example.com"
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  # TODO: Set the role name to "pod-reader"
  apiGroup: rbac.authorization.k8s.io

