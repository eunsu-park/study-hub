# === Exercise 4: Validation with CEL Expressions ===
# Use CEL (Common Expression Language) for advanced validation.
# Hint: CEL validation runs server-side (K8s 1.25+).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: deploymentconfigs.apps.example.com
spec:
  group: apps.example.com
  names:
    kind: DeploymentConfig
    plural: deploymentconfigs
    singular: deploymentconfig
    shortNames: ["dc"]
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              minReplicas:
                type: integer
              maxReplicas:
                type: integer
              environment:
                type: string
            # TODO: Add x-kubernetes-validations with CEL rules:
            #   - rule: "self.maxReplicas >= self.minReplicas"
            #     message: "maxReplicas must be >= minReplicas"
            #   - rule: "self.environment == 'prod' ? self.minReplicas >= 3 : true"
            #     message: "production must have at least 3 replicas"

