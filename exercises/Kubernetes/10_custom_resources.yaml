# === Exercise 1: Define a CRD with Validation ===
# Create a CRD for a "WebApplication" custom resource.
# Hint: CRDs extend the Kubernetes API with your own resource types.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapplications.apps.example.com
spec:
  group: apps.example.com
  names:
    # TODO: Set kind to "WebApplication"
    # TODO: Set plural to "webapplications"
    # TODO: Set singular to "webapplication"
    # TODO: Set shortNames to ["webapp", "wa"]
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: ["image", "replicas"]
            properties:
              image:
                type: string
                # TODO: Add a pattern validation for image format
                # Hint: pattern: "^[a-z0-9-]+(/[a-z0-9-]+)*(:[a-zA-Z0-9._-]+)?$"
              replicas:
                type: integer
                # TODO: Set minimum to 1 and maximum to 10
              port:
                type: integer
                # TODO: Set default to 8080
                # TODO: Set minimum to 1 and maximum to 65535
              environment:
                type: string
                # TODO: Add enum validation: ["dev", "staging", "prod"]
          status:
            type: object
            properties:
              # TODO: Add "availableReplicas" field of type integer
              # TODO: Add "conditions" as an array of objects with
              #       fields: type (string), status (string), lastTransitionTime (string)
    # TODO: Add additionalPrinterColumns for kubectl output:
    #   - name: Replicas, jsonPath: .spec.replicas, type: integer
    #   - name: Image, jsonPath: .spec.image, type: string
    #   - name: Environment, jsonPath: .spec.environment, type: string
    #   - name: Age, jsonPath: .metadata.creationTimestamp, type: date
