kind: CustomResourceDefinition
metadata:
  name: caches.data.example.com
spec:
  group: data.example.com
  names:
    kind: Cache
    plural: caches
    singular: cache
    shortNames: ["ca"]
    # TODO: Add categories: ["all", "data"]
    # This makes the CR appear in 'kubectl get all' and 'kubectl get data'
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              engine:
                type: string
                # TODO: Add enum: ["redis", "memcached"]
              maxMemory:
