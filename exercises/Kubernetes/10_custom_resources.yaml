# === Exercise 3: CRD with Multiple Versions ===
# Add a v2 version with schema changes and conversion.
# Hint: Only one version can be the storage version.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.data.example.com
spec:
  group: data.example.com
  names:
    kind: Database
    plural: databases
    singular: database
    shortNames: ["db"]
  scope: Namespaced
  versions:
  - name: v1
    served: true
    # TODO: Set storage to false (v2 is the storage version now)
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              engine:
                type: string
              size:
                type: string
  - name: v2
    served: true
    # TODO: Set storage to true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: ["engine", "storage"]
            properties:
              engine:
                type: string
                enum: ["postgres", "mysql", "mongodb"]
              storage:
                type: object
                properties:
                  # TODO: Add "size" field of type string (e.g., "10Gi")
                  # TODO: Add "class" field of type string (storage class name)
                  # TODO: Add "backup" field of type boolean, default false
    subresources:
      status: {}

