# === Exercise 2: Pod with PVC Volume Mount ===
# Attach the PVC to a Pod running PostgreSQL.
# Hint: volumeMounts connect a named volume to a container path.
apiVersion: v1
kind: Pod
metadata:
  name: postgres-pod
spec:
  containers:
  - name: postgres
    image: postgres:16-alpine
    env:
    - name: POSTGRES_PASSWORD
      value: "changeme"
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
    volumeMounts:
    # TODO: Mount volume "db-vol" at path /var/lib/postgresql/data
    ports:
    - containerPort: 5432
  volumes:
