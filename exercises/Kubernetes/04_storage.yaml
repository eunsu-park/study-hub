# === Exercise 4: Multi-Volume Pod with emptyDir and PVC ===
# Use emptyDir for scratch space and PVC for persistent data.
# Hint: emptyDir is ephemeral — data is lost when the Pod is removed.
apiVersion: v1
kind: Pod
metadata:
  name: multi-volume-pod
spec:
  containers:
  - name: app
    image: alpine:latest
    command: ["sh", "-c", "while true; do date >> /data/persistent/log.txt; sleep 60; done"]
    volumeMounts:
    - name: persistent-data
      mountPath: /data/persistent
    # TODO: Add a volumeMount for "scratch-space" at /tmp/scratch
  - name: sidecar
    image: alpine:latest
    command: ["sh", "-c", "tail -f /shared/log.txt"]
    volumeMounts:
    # TODO: Mount "persistent-data" at /shared (same volume, different path)
    # This allows the sidecar to read data written by the main container
  volumes:
  - name: persistent-data
    persistentVolumeClaim:
      claimName: db-storage
  # TODO: Add an emptyDir volume named "scratch-space"
  # Hint: emptyDir: {} creates a temporary directory backed by node disk
  # Optional: Use emptyDir: { medium: Memory } for a tmpfs mount

