# === Exercise 5: Model Serving Autoscaling with KNative ===
# Deploy a serverless inference endpoint that scales to zero.
# Hint: KNative Serving provides request-based autoscaling.
#
# Note: This exercise uses KNative Serving rather than KServe (used in the
# example file) to expose learners to serverless inference patterns and
# request-based autoscaling. Both are valid production approaches; understanding
# both frameworks reflects the diversity of serving infrastructure found across
# ML platform teams.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ml-predictor
spec:
  template:
    metadata:
      annotations:
        # TODO: Set autoscaling target to 10 concurrent requests per pod
        # Hint: autoscaling.knative.dev/target: "10"
        # TODO: Set scale-to-zero grace period to 5 minutes
        # Hint: autoscaling.knative.dev/scale-to-zero-grace-period: "5m"
        # TODO: Set minimum scale to 0 and maximum to 20
        # Hint: autoscaling.knative.dev/min-scale: "0"
        #       autoscaling.knative.dev/max-scale: "20"
    spec:
