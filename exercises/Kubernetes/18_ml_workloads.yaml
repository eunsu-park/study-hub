# === Exercise 1: GPU-Enabled Pod for Model Inference ===
# Deploy a Pod with GPU resources for ML model serving.
# Hint: GPU scheduling requires the NVIDIA device plugin DaemonSet.
apiVersion: v1
kind: Pod
metadata:
  name: ml-inference
  labels:
    app: ml-inference
spec:
  containers:
  - name: model-server
    image: tensorflow/serving:2.14.0-gpu
    ports:
    - containerPort: 8501
      name: rest
    - containerPort: 8500
      name: grpc
    resources:
      limits:
        # TODO: Request 1 GPU using nvidia.com/gpu: 1
        cpu: "4"
        memory: "8Gi"
      requests:
        cpu: "2"
        memory: "4Gi"
    env:
    - name: MODEL_NAME
      value: "my_model"
    volumeMounts:
    # TODO: Mount the model files from a PVC at /models/my_model
    # Hint: The model directory structure should be:
    #   /models/my_model/1/saved_model.pb
  # TODO: Add a nodeSelector to target GPU nodes
  # Hint: nodeSelector:
  #         accelerator: nvidia-tesla-v100
  # TODO: Add a toleration for the GPU taint
  # Hint: tolerations:
  #       - key: nvidia.com/gpu
  #         operator: Exists
  #         effect: NoSchedule
  volumes:
  # TODO: Define a PVC volume for model storage

---
# === Exercise 2: Training Job with Multiple GPUs ===
# Run a distributed training job across multiple GPUs.
# Hint: Use a Job with resource requests for multiple GPUs.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
spec:
  backoffLimit: 3
  completions: 1
  template:
    metadata:
      labels:
        app: training
    spec:
      containers:
      - name: trainer
        image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
        command: ["python", "train.py"]
        args:
        - "--epochs=100"
        - "--batch-size=64"
        - "--learning-rate=0.001"
        resources:
          limits:
            # TODO: Request 4 GPUs for data-parallel training
            # Hint: nvidia.com/gpu: 4
            cpu: "16"
            memory: "64Gi"
        env:
        # TODO: Set NCCL_DEBUG to INFO for distributed training diagnostics
        # TODO: Set CUDA_VISIBLE_DEVICES to "0,1,2,3"
        volumeMounts:
        - name: dataset
          mountPath: /data
          readOnly: true
        - name: output
          mountPath: /output
      restartPolicy: Never
      volumes:
      # TODO: Add a PVC volume "dataset" for training data (ReadOnlyMany)
      # TODO: Add a PVC volume "output" for model checkpoints (ReadWriteOnce)

