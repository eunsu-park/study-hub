# === Exercise 3: Model Serving with Seldon Core ===
# Deploy a model using Seldon Core's SeldonDeployment CRD.
# Hint: Seldon Core provides inference graphs, A/B testing, and canary rollouts.
#
# Note: This exercise uses Seldon Core deliberately, even though the example
# file uses KServe. The ML serving ecosystem includes multiple production-grade
# frameworks (KServe, Seldon Core, BentoML, Ray Serve, Triton, etc.), and
# exposure to different CRD schemas broadens awareness of real-world tooling
# choices learners will encounter in the field.
apiVersion: machinelearning.seldon.io/v1
kind: SeldonDeployment
metadata:
  name: sentiment-classifier
spec:
  predictors:
  - name: default
    replicas: 3
    graph:
      # TODO: Set name to "classifier"
      # TODO: Set implementation to "SKLEARN_SERVER"
      # TODO: Set modelUri to "gs://my-models/sentiment/v1"
      children: []
    componentSpecs:
    - spec:
        containers:
        - name: classifier
          resources:
            requests:
              # TODO: Set CPU to 500m and memory to 1Gi
            limits:
              cpu: "1"
              memory: "2Gi"
