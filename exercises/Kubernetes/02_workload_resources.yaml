# === Exercise 2: StatefulSet with Persistent Storage ===
# Deploy a StatefulSet for a database workload.
# Hint: StatefulSets provide stable network identities and ordered startup.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db
spec:
  serviceName: "postgres"
  replicas: 3
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          value: "changeme"
        volumeMounts:
