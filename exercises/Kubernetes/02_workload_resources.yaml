# === Exercise 4: Job and CronJob ===
# Create a one-shot Job and a recurring CronJob.
# Hint: Jobs run to completion; CronJobs schedule Jobs on a cron expression.
apiVersion: batch/v1
kind: Job
metadata:
  name: data-migration
spec:
  # TODO: Set backoffLimit to 3 (retry up to 3 times on failure)
  # TODO: Set activeDeadlineSeconds to 600 (timeout after 10 minutes)
  template:
    spec:
      containers:
      - name: migrate
        image: alpine:latest
        command: ["sh", "-c", "echo 'Running migration...' && sleep 10 && echo 'Done'"]
      restartPolicy: Never

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-backup
spec:
  # TODO: Set schedule to run at 2:00 AM every day
  # Hint: Cron format is "minute hour day month weekday"
  # TODO: Set concurrencyPolicy to Forbid (skip if previous run still active)
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: alpine:latest
            command: ["sh", "-c", "echo 'Backup started at $(date)' && sleep 5"]
          restartPolicy: OnFailure

