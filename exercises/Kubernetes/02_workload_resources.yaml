      # TODO: Set maxUnavailable to 0 (never reduce below desired count)
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web
        # TODO: Set the image to nginx:1.24-alpine
        ports:
        - containerPort: 80
