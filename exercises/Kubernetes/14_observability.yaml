# === Exercise 5: OpenTelemetry Collector ===
# Deploy an OTel Collector to receive, process, and export telemetry.
# Hint: The Collector acts as a pipeline: receivers -> processors -> exporters.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
