# === Exercise 3: Grafana Dashboard ConfigMap ===
# Define a Grafana dashboard as code using a ConfigMap.
# Hint: Grafana sidecar auto-loads dashboards from labeled ConfigMaps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-dashboard
  namespace: monitoring
  labels:
    # TODO: Add label "grafana_dashboard: '1'" for sidecar auto-discovery
data:
  app-dashboard.json: |
    {
      "dashboard": {
        "title": "Application Overview",
        "panels": [
          {
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(http_requests_total[5m])) by (method, status)"
              }
            ]
          }
        ]
      }
    }
    # TODO: Add a panel for "Error Rate" using:
    #   expr: sum(rate(http_requests_total{status=~"5.."}[5m]))
    # TODO: Add a panel for "Response Latency P99" using:
    #   expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
    # TODO: Add a panel for "Pod CPU Usage" using:
    #   expr: sum(rate(container_cpu_usage_seconds_total[5m])) by (pod)

