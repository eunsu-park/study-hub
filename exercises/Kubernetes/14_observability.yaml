# === Exercise 4: Loki Log Collection with Promtail ===
# Deploy Promtail to ship logs to Loki.
# Hint: Promtail runs as a DaemonSet and tails container log files.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      containers:
      - name: promtail
        image: grafana/promtail:2.9.0
        args:
        - -config.file=/etc/promtail/promtail.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
        # TODO: Mount /var/log/pods as read-only (container log files)
        # TODO: Mount /var/lib/docker/containers as read-only (Docker runtime logs)
      volumes:
      - name: config
        configMap:
          name: promtail-config
      # TODO: Add hostPath volumes for /var/log/pods and /var/lib/docker/containers

