# === Exercise 5: Immutable ConfigMap and Secret ===
# Mark configuration as immutable for performance and safety.
# Hint: Immutable ConfigMaps/Secrets cannot be updated — only deleted and recreated.
apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags
# TODO: Set 'immutable: true'
# Benefits:
#   - kubelet stops watching for changes (reduces API server load)
#   - Prevents accidental modification in production
data:
  ENABLE_NEW_UI: "true"
  ENABLE_DARK_MODE: "false"
  # TODO: Add a feature flag "ENABLE_BETA_API" set to "false"

