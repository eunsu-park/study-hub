# === Exercise 1: Horizontal Pod Autoscaler (HPA) with CPU ===
# Scale a Deployment based on CPU utilization.
# Hint: HPA requires metrics-server to be installed in the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-intensive-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpu-app
  template:
    metadata:
      labels:
        app: cpu-app
    spec:
      containers:
      - name: app
        image: python:3.12-slim
        command: ["python", "-c", "import http.server; http.server.HTTPServer(('',8080), http.server.SimpleHTTPRequestHandler).serve_forever()"]
        resources:
          requests:
            # TODO: Set CPU request to 200m (required for HPA to calculate utilization)
            # TODO: Set memory request to 128Mi
          limits:
            cpu: "500m"
            memory: "256Mi"

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpu-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    # TODO: Set name to "cpu-intensive-app"
  # TODO: Set minReplicas to 2
  # TODO: Set maxReplicas to 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        # TODO: Set averageUtilization to 70
        # When average CPU across all pods > 70%, HPA adds more replicas

