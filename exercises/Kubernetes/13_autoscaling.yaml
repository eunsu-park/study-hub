# Automatically adjust CPU and memory requests.
# Hint: VPA requires the VPA controller to be installed.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: app-vpa
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    # TODO: Set name to "web-server"
  updatePolicy:
    # TODO: Set updateMode to "Auto"
    # Options: "Off" (recommendations only), "Initial" (set at creation),
    #          "Auto" (evict and recreate Pods with new resource values)
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      # TODO: Set minAllowed: cpu: 100m, memory: 128Mi
      # TODO: Set maxAllowed: cpu: 2, memory: 2Gi
      # These bounds prevent VPA from setting extreme values

