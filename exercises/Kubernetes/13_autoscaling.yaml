# === Exercise 2: HPA with Multiple Metrics ===
# Scale based on both CPU and memory.
# Hint: When multiple metrics are defined, HPA uses the one requiring the most replicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: multi-metric-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-server
  minReplicas: 3
  maxReplicas: 20
  metrics:
  # TODO: Add a CPU metric with averageUtilization target of 60%
  # TODO: Add a memory metric with averageUtilization target of 75%
  # TODO: Add an external metric for requests-per-second:
  #   - type: Pods
  #     pods:
  #       metric:
  #         name: http_requests_per_second
  #       target:
  #         type: AverageValue
  #         averageValue: "100"
  behavior:
    scaleDown:
      # TODO: Set stabilizationWindowSeconds to 300 (wait 5 min before scaling down)
      # This prevents flapping when load fluctuates
      policies:
      - type: Percent
        value: 10
        # TODO: Set periodSeconds to 60 (scale down max 10% per minute)
    scaleUp:
      # TODO: Set stabilizationWindowSeconds to 0 (scale up immediately)
      policies:
      - type: Percent
        value: 100
        # TODO: Set periodSeconds to 15 (allow doubling every 15 seconds)
      - type: Pods
        value: 4
        periodSeconds: 15
      # TODO: Set selectPolicy to "Max" (use whichever policy allows more scaling)

