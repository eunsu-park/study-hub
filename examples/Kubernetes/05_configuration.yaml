# 05_configuration — ConfigMap, Secret mounting examples
# Apply: kubectl apply -f 05_configuration.yaml

---
# ConfigMap: application configuration as key-value pairs
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: production
  LOG_LEVEL: info
  MAX_CONNECTIONS: "100"
  DATABASE_HOST: postgres.default.svc.cluster.local

---
# ConfigMap: configuration file content
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    server {
        listen 80;
        server_name _;
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }

---
# Secret: base64-encoded credentials (use sealed-secrets in production)
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  username: app_user
  password: s3cret-p@ssw0rd
  connection-string: postgresql://app_user:s3cret-p@ssw0rd@postgres:5432/mydb

---
# Pod: mounting ConfigMap as env vars and Secret as volume
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "Environment variables from ConfigMap:"
          echo "  APP_ENV=$APP_ENV"
          echo "  LOG_LEVEL=$LOG_LEVEL"
          echo ""
          echo "Secret mounted as files:"
          echo "  username=$(cat /etc/secrets/username)"
          echo "  password=$(cat /etc/secrets/password)"
          echo ""
          echo "Nginx config file:"
          cat /etc/nginx/conf.d/nginx.conf
          sleep 3600
      envFrom:
        - configMapRef:
            name: app-config
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: db-credentials
        defaultMode: 0400
    - name: nginx-conf
      configMap:
        name: nginx-config

---
# Deployment: using projected volumes to combine ConfigMap and Secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projected-config-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projected-demo
  template:
    metadata:
      labels:
        app: projected-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "ls -la /etc/app-config/ && sleep 3600"]
          volumeMounts:
            - name: all-config
              mountPath: /etc/app-config
              readOnly: true
      volumes:
        - name: all-config
          projected:
            sources:
              - configMap:
                  name: app-config
              - secret:
                  name: db-credentials
                  items:
                    - key: connection-string
                      path: db-url
