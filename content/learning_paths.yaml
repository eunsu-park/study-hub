# Learning Paths — Cross-Topic Curricula
# Defines ordered sequences of topics forming structured study paths.
# Only includes paths that can be followed with currently published topics.

paths:
  python_developer:
    label:
      en: "Python Developer"
      ko: "Python 개발자"
    description:
      en: "From Python fundamentals to advanced patterns including decorators, metaclasses, and async."
      ko: "Python 기초부터 데코레이터, 메타클래스, 비동기를 포함한 고급 패턴까지."
    icon: "code"
    color: "#0d6efd"
    topics:
      - Programming
      - Python_Basics
      - Python_Advanced

  systems_programmer:
    label:
      en: "Systems Programmer"
      ko: "시스템 프로그래머"
    description:
      en: "From C/C++ fundamentals to advanced systems programming, Rust, and concurrency."
      ko: "C/C++ 기초부터 고급 시스템 프로그래밍, Rust, 동시성까지."
    icon: "code"
    color: "#fd7e14"
    topics:
      - Programming
      - C_Basics
      - C_Advanced
      - CPP_Basics
      - CPP_Advanced
      - Rust_Basics
      - Rust_Advanced

  cv_engineer:
    label:
      en: "Computer Vision Engineer"
      ko: "컴퓨터 비전 엔지니어"
    description:
      en: "From Python and ML to deep learning and computer vision."
      ko: "Python과 ML부터 딥러닝, 컴퓨터 비전까지."
    icon: "dashboard"
    color: "#dc3545"
    topics:
      - Programming
      - Python_Basics
      - Python_Advanced
      - Machine_Learning
      - Deep_Learning
      - Computer_Vision

  ml_engineer:
    label:
      en: "Machine Learning Engineer"
      ko: "머신러닝 엔지니어"
    description:
      en: "From Python to classical ML and deep learning with PyTorch."
      ko: "Python부터 고전 ML, PyTorch 딥러닝까지."
    icon: "dashboard"
    color: "#198754"
    topics:
      - Programming
      - Python_Basics
      - Python_Advanced
      - Machine_Learning
      - Deep_Learning

  linux_devops:
    label:
      en: "Linux & DevOps"
      ko: "Linux & DevOps"
    description:
      en: "Linux system administration, shell scripting, and containerization."
      ko: "Linux 시스템 관리, 셸 스크립팅, 컨테이너화."
    icon: "list"
    color: "#6f42c1"
    topics:
      - Linux
      - Shell_Script
      - Git
      - Docker

  scientific_computing:
    label:
      en: "Scientific Computing"
      ko: "과학 계산"
    description:
      en: "From calculus and linear algebra to mathematical methods and numerical physics."
      ko: "미적분학과 선형대수부터 수리물리학, 전자기학까지."
    icon: "list"
    color: "#20c997"
    topics:
      - Calculus_and_Differential_Equations
      - Linear_Algebra
      - Probability_and_Statistics
      - Mathematical_Methods
      - Math_for_AI
      - Electrodynamics

  space_physics:
    label:
      en: "Space Physics"
      ko: "우주물리학"
    description:
      en: "From calculus to plasma physics, MHD, solar physics, and space weather."
      ko: "미적분학부터 플라즈마 물리학, MHD, 태양물리학, 우주기상까지."
    icon: "list"
    color: "#e83e8c"
    topics:
      - Calculus_and_Differential_Equations
      - Mathematical_Methods
      - Electrodynamics
      - IDL_Basics
      - IDL_Advanced
      - Numerical_Simulation
      - Plasma_Physics
      - MHD
      - Solar_Physics
      - Space_Weather

  data_and_ai:
    label:
      en: "Data & AI"
      ko: "데이터 & AI"
    description:
      en: "From data science to deep learning, NLP/LLM, and reinforcement learning."
      ko: "데이터 과학부터 딥러닝, NLP/LLM, 강화학습까지."
    icon: "dashboard"
    color: "#0dcaf0"
    topics:
      - Data_Science
      - Machine_Learning
      - Deep_Learning
      - NLP_and_LLM
      - Foundation_Models
      - Reinforcement_Learning
