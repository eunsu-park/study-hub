# Learning Paths — Cross-Topic Curricula
# Defines ordered sequences of topics forming structured study paths.
# Only includes paths that can be followed with currently published topics.

paths:
  python_developer:
    label:
      en: "Python Developer"
      ko: "Python 개발자"
    description:
      en: "From Python fundamentals to advanced patterns including decorators, metaclasses, and async."
      ko: "Python 기초부터 데코레이터, 메타클래스, 비동기를 포함한 고급 패턴까지."
    icon: "code"
    color: "#0d6efd"
    topics:
      - Programming
      - Python_Basics
      - Python_Advanced

  systems_programmer:
    label:
      en: "Systems Programmer"
      ko: "시스템 프로그래머"
    description:
      en: "From C/C++ fundamentals to advanced systems programming, templates, and concurrency."
      ko: "C/C++ 기초부터 고급 시스템 프로그래밍, 템플릿, 동시성까지."
    icon: "code"
    color: "#fd7e14"
    topics:
      - Programming
      - C_Basics
      - C_Advanced
      - CPP_Basics
      - CPP_Advanced
