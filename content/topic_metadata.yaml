# Topic Metadata — Tier Classification & Dependencies
# Single source of truth for difficulty tiers and topic prerequisites.
# Both viewer/ and site/ read this file.
#
# Tier IDs: beginner, intermediate, advanced, expert
# When adding a new topic, add an entry here with the appropriate tier.
# prerequisites: list of topic names that should be studied before this topic.

tiers:
  - id: beginner
    label:
      en: "Beginner"
      ko: "입문"
    color: "#198754"
    order: 1
    description:
      en: "Foundational tools and languages. No prior CS knowledge required."
      ko: "기초 도구 및 언어. 사전 CS 지식 불필요."

  - id: intermediate
    label:
      en: "Intermediate"
      ko: "중급"
    color: "#0d6efd"
    order: 2
    description:
      en: "Requires programming proficiency. Deeper CS and data skills."
      ko: "프로그래밍 능숙도 필요. 심화 CS 및 데이터 기술."

  - id: advanced
    label:
      en: "Advanced"
      ko: "고급"
    color: "#fd7e14"
    order: 3
    description:
      en: "Requires strong math/CS background. Specialized domains."
      ko: "강한 수학/CS 배경 필요. 전문 분야."

  - id: expert
    label:
      en: "Expert"
      ko: "전문"
    color: "#dc3545"
    order: 4
    description:
      en: "Domain-specific expert content. Graduate-level knowledge."
      ko: "도메인 전문 콘텐츠. 대학원 수준 지식."

# ── Topic assignments ────────────────────────────────────────────────────

topics:
  # Tier 1 — Beginner (18 topics)
  Programming:
    tier: beginner
    description:
      en: "Core programming concepts and paradigms"
      ko: "핵심 프로그래밍 개념과 패러다임"

  Python_Basics:
    tier: beginner
    prerequisites: [Programming]
    description:
      en: "Python language fundamentals and OOP"
      ko: "Python 언어 기초 및 객체지향 프로그래밍"

  C_Basics:
    tier: beginner
    prerequisites: [Programming]
    description:
      en: "C language fundamentals and basic programming"
      ko: "C 언어 기초 및 기본 프로그래밍"

  CPP_Basics:
    tier: beginner
    prerequisites: [C_Basics]
    description:
      en: "C++ language fundamentals, OOP, and basic STL"
      ko: "C++ 언어 기초, 객체지향 프로그래밍 및 기본 STL"

  Git:
    tier: beginner
    description:
      en: "Version control with Git"
      ko: "Git을 활용한 버전 관리"

  VIM:
    tier: beginner
    description:
      en: "Modal editing, motions, text objects, plugins, and Neovim"
      ko: "모달 편집, 모션, 텍스트 객체, 플러그인 및 Neovim"

  Shell_Script:
    tier: beginner
    description:
      en: "Bash scripting and CLI fundamentals"
      ko: "Bash 스크립팅 및 CLI 기초"

  Linux:
    tier: beginner
    description:
      en: "Linux system administration and usage"
      ko: "Linux 시스템 관리 및 사용법"

  Docker:
    tier: beginner
    prerequisites: [Linux]
    description:
      en: "Containerization with Docker and Kubernetes"
      ko: "Docker와 Kubernetes를 활용한 컨테이너화"

  CSharp_Basics:
    tier: beginner
    prerequisites: [Programming]
    description:
      en: "C# fundamentals: syntax, types, OOP basics, collections, exception handling, and file I/O"
      ko: "C# 기초: 문법, 타입, OOP 기초, 컬렉션, 예외 처리 및 파일 I/O"

  Go_Basics:
    tier: beginner
    prerequisites: [Programming]
    description:
      en: "Go language fundamentals: types, functions, interfaces, concurrency, and testing"
      ko: "Go 언어 기초: 타입, 함수, 인터페이스, 동시성 및 테스팅"

  Rust_Basics:
    tier: beginner
    prerequisites: [Programming]
    description:
      en: "Rust fundamentals: ownership, borrowing, traits, concurrency, async, and Cargo"
      ko: "Rust 기초: 소유권, 빌림, 트레이트, 동시성, 비동기 및 Cargo"

  IDL_Basics:
    tier: beginner
    prerequisites: [Programming]
    description:
      en: "IDL fundamentals: arrays, plotting, FITS files, structures, and basic solar data handling"
      ko: "IDL 기초: 배열, 플로팅, FITS 파일, 구조체 및 기본 태양 데이터 처리"

  Web_Development:
    tier: beginner
    description:
      en: "HTML, CSS, JavaScript, TypeScript, accessibility, SEO, and web components"
      ko: "HTML, CSS, JavaScript, TypeScript, 접근성, SEO 및 웹 컴포넌트"

  Cloud_Computing:
    tier: beginner
    description:
      en: "Cloud services and infrastructure (AWS, GCP)"
      ko: "클라우드 서비스 및 인프라 (AWS, GCP)"

  LaTeX:
    tier: beginner
    description:
      en: "Document typesetting with LaTeX"
      ko: "LaTeX을 활용한 문서 조판"

  Claude_Ecosystem:
    tier: beginner
    description:
      en: "Claude Code, MCP, Agent SDK, and AI tools"
      ko: "Claude Code, MCP, Agent SDK 및 AI 도구"

  # Tier 2 — Intermediate (15 topics)
  CSharp_Advanced:
    tier: intermediate
    prerequisites: [CSharp_Basics]
    description:
      en: "Advanced C#: LINQ, async/await, pattern matching, records, Span<T>, DI, and .NET ecosystem"
      ko: "C# 고급: LINQ, async/await, 패턴 매칭, 레코드, Span<T>, DI 및 .NET 생태계"

  Calculus_and_Differential_Equations:
    tier: intermediate
    description:
      en: "Calculus fundamentals, multivariable calculus, ODE, PDE, and modeling"
      ko: "미적분학 기초, 다변수 미적분, 상미분방정식, 편미분방정식 및 모델링"

  Linear_Algebra:
    tier: intermediate
    prerequisites: [Programming, Python_Basics]
    description:
      en: "Vector spaces, matrix decompositions, SVD, PCA, numerical methods, ML/DL/CG applications"
      ko: "벡터 공간, 행렬 분해, SVD, PCA, 수치 해법, ML/DL/CG 응용"

  Probability_and_Statistics:
    tier: intermediate
    prerequisites: [Python_Basics]
    description:
      en: "Probability theory, statistical inference, and stochastic processes"
      ko: "확률론, 통계적 추론, 확률 과정"

  Python_Advanced:
    tier: intermediate
    prerequisites: [Python_Basics]
    description:
      en: "Advanced Python syntax and patterns"
      ko: "고급 Python 문법 및 패턴"

  C_Advanced:
    tier: intermediate
    prerequisites: [C_Basics]
    description:
      en: "Advanced C programming and systems programming"
      ko: "고급 C 프로그래밍 및 시스템 프로그래밍"

  CPP_Advanced:
    tier: intermediate
    prerequisites: [CPP_Basics]
    description:
      en: "Advanced C++ templates, modern standards, concurrency, and design patterns"
      ko: "고급 C++ 템플릿, 모던 표준, 동시성 및 디자인 패턴"

  Data_Science:
    tier: intermediate
    prerequisites: [Python_Basics]
    description:
      en: "Statistics, data analysis, and visualization"
      ko: "통계, 데이터 분석 및 시각화"

  Database_Theory:
    tier: intermediate
    prerequisites: [Programming]
    description:
      en: "Database theory and implementation"
      ko: "데이터베이스 이론 및 구현"

  Machine_Learning:
    tier: intermediate
    prerequisites: [Python_Basics, Data_Science]
    description:
      en: "Classical machine learning algorithms"
      ko: "고전 머신러닝 알고리즘"

  Networking:
    tier: intermediate
    prerequisites: [Programming]
    description:
      en: "Network protocols and architecture"
      ko: "네트워크 프로토콜 및 아키텍처"

  OS_Theory:
    tier: intermediate
    prerequisites: [Programming]
    description:
      en: "Operating system concepts and theory"
      ko: "운영체제 개념 및 이론"

  PostgreSQL:
    tier: intermediate
    prerequisites: [Programming]
    description:
      en: "PostgreSQL database management"
      ko: "PostgreSQL 데이터베이스 관리"

  Go_Advanced:
    tier: intermediate
    prerequisites: [Go_Basics]
    description:
      en: "Advanced Go: HTTP servers, REST APIs, databases, generics, reflection, cloud-native patterns, and microservices"
      ko: "Go 고급: HTTP 서버, REST API, 데이터베이스, 제네릭, 리플렉션, 클라우드 네이티브 패턴 및 마이크로서비스"

  Rust_Advanced:
    tier: intermediate
    prerequisites: [Rust_Basics]
    description:
      en: "Advanced Rust: unsafe, macros, FFI, WebAssembly, embedded, networking, and performance"
      ko: "Rust 고급: unsafe, 매크로, FFI, WebAssembly, 임베디드, 네트워킹 및 성능"

  IDL_Advanced:
    tier: intermediate
    prerequisites: [IDL_Basics]
    description:
      en: "Advanced IDL: SolarSoft, SDO/AIA/HMI analysis, spectral methods, image processing, and IDL-Python bridge"
      ko: "IDL 고급: SolarSoft, SDO/AIA/HMI 분석, 스펙트럴 방법, 영상 처리 및 IDL-Python 브리지"

  Software_Engineering:
    tier: intermediate
    prerequisites: [Programming]
    description:
      en: "Software engineering practices and methodologies"
      ko: "소프트웨어 공학 실무 및 방법론"

  Security:
    tier: intermediate
    prerequisites: [Networking]
    description:
      en: "Cybersecurity principles and practices"
      ko: "사이버보안 원칙 및 실무"

  Cryptography_Theory:
    tier: intermediate
    prerequisites: [Programming]
    description:
      en: "Cryptographic algorithms, protocols, and mathematical foundations"
      ko: "암호화 알고리즘, 프로토콜 및 수학적 기초"

  Formal_Languages:
    tier: intermediate
    prerequisites: [Programming]
    description:
      en: "Automata theory, formal languages, and computability"
      ko: "오토마타 이론, 형식 언어 및 계산 가능성"

  # Tier 3 — Advanced (12 topics)
  Algorithm:
    tier: advanced
    prerequisites: [Programming]
    description:
      en: "Advanced algorithms and data structures"
      ko: "고급 알고리즘 및 자료구조"

  Computer_Vision:
    tier: advanced
    prerequisites: [Deep_Learning]
    description:
      en: "Computer vision and image processing"
      ko: "컴퓨터 비전 및 영상 처리"

  Deep_Learning:
    tier: advanced
    prerequisites: [Machine_Learning]
    description:
      en: "Deep learning with PyTorch and model implementations"
      ko: "PyTorch 딥러닝 및 모델 구현"

  Electrodynamics:
    tier: advanced
    prerequisites: [Calculus_and_Differential_Equations, Mathematical_Methods]
    description:
      en: "Electromagnetic theory, Maxwell's equations, waves, and computational EM"
      ko: "전자기 이론, 맥스웰 방정식, 전자기파 및 전산 전자기학"

  Math_for_AI:
    tier: advanced
    prerequisites: [Calculus_and_Differential_Equations]
    description:
      en: "Mathematics for artificial intelligence"
      ko: "인공지능을 위한 수학"

  Mathematical_Methods:
    tier: advanced
    prerequisites: [Calculus_and_Differential_Equations]
    description:
      en: "Mathematical methods for physics"
      ko: "물리학을 위한 수학적 방법"

  Data_Engineering:
    tier: advanced
    prerequisites: [Data_Science]
    description:
      en: "Data pipeline architecture and tools"
      ko: "데이터 파이프라인 아키텍처 및 도구"

  Foundation_Models:
    tier: advanced
    prerequisites: [Deep_Learning, NLP_and_LLM]
    description:
      en: "FM paradigm, scaling laws, multimodal architectures"
      ko: "FM 패러다임, 스케일링 법칙, 멀티모달 아키텍처"

  NLP_and_LLM:
    tier: advanced
    prerequisites: [Deep_Learning]
    description:
      en: "NLP fundamentals, LLM applications, RAG, agents"
      ko: "NLP 기초, LLM 활용, RAG, 에이전트"

  Numerical_Simulation:
    tier: advanced
    prerequisites: [Calculus_and_Differential_Equations]
    description:
      en: "Numerical methods and computational simulation"
      ko: "수치 해석 및 전산 시뮬레이션"

  Optics:
    tier: advanced
    prerequisites: [Electrodynamics]
    description:
      en: "Geometric and wave optics, lasers, adaptive optics"
      ko: "기하광학, 파동광학, 레이저, 적응광학"

  Reinforcement_Learning:
    tier: advanced
    prerequisites: [Machine_Learning]
    description:
      en: "Reinforcement learning algorithms"
      ko: "강화학습 알고리즘"

  # Tier 4 — Expert (4 topics)
  MHD:
    tier: expert
    prerequisites: [Plasma_Physics]
    description:
      en: "Magnetohydrodynamics theory and simulation"
      ko: "자기유체역학 이론 및 시뮬레이션"

  Plasma_Physics:
    tier: expert
    prerequisites: [Electrodynamics]
    description:
      en: "Plasma physics fundamentals and applications"
      ko: "플라즈마 물리학 기초 및 응용"

  Solar_Physics:
    tier: expert
    prerequisites: [Plasma_Physics]
    description:
      en: "Solar interior, atmosphere, magnetic activity, flares, CMEs"
      ko: "태양 내부, 대기, 자기 활동, 플레어, CME"

  DL_Scratch_C:
    tier: expert
    prerequisites: [C_Advanced, CPP_Advanced, Linear_Algebra, Deep_Learning, Computer_Architecture]
    description:
      en: "Build deep learning from scratch in C/C++: tensor engine, autograd, CNN (ResNet/EfficientNet/ViT), Transformer (GPT-2/Llama), training, quantization, and inference engine"
      ko: "C/C++로 딥러닝 밑바닥 구현: 텐서 엔진, 자동미분, CNN(ResNet/EfficientNet/ViT), Transformer(GPT-2/Llama), 학습, 양자화, 추론 엔진"

  Space_Weather:
    tier: expert
    prerequisites: [Solar_Physics, MHD]
    description:
      en: "Sun-Earth interactions, magnetosphere, GIC, forecasting"
      ko: "태양-지구 상호작용, 자기권, GIC, 우주기상 예보"
